<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.I's Emoji World</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <h1>Mr.I's Emoji World 🤯</h1>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message system">
                    Mr.I has entered the chat! 🎉
                </div>
            </div>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Type your message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <audio id="rockSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d0c6ff1bab.mp3?filename=maneskin-beggin.mp3" preload="auto"></audio>
    <audio id="happySound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_2c8b6b5b9d.mp3?filename=maneskin-mammamia.mp3" preload="auto"></audio>
    <audio id="danceSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b7b6b5b9d.mp3?filename=maneskin-zitti-e-buoni.mp3" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
