<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.I's Emoji World</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤯</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <h1>Mr.I's Emoji World 🤯</h1>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message system">
                    Mr.I has entered the chat! 🎉
                </div>
            </div>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Type your message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <audio id="rockSound" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto" style="display: none;"></audio>
    <audio id="happySound" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" preload="auto" style="display: none;"></audio>
    <audio id="danceSound" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" preload="auto" style="display: none;"></audio>
    <script src="script.js"></script>
</body>
</html>
